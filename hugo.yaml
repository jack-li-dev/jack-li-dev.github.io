baseURL: "https://jack-li.me/"
title: "Jack Li"
theme: "PaperMod"
hasCJKLanguage: false
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

minify:
  minifyOutput: true

taxonomies:
  category: "categories"
  tag: "tags"

languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    params:
      profileMode:
        enabled: true
        title: "Jack Li"
        subtitle: "Independent offshore infrastructure, sovereignty firewalls, and high-availability systems."
        imageUrl: ""
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 10
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 30
        - identifier: search
          name: Search
          url: /search/
          weight: 40

params:
  author: "Jack Li"
  env: production
  lts_string: "[LTS: 2026.05.26]"
  defaultTheme: "dark"
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showToc: true
  TocOpen: false
  disableSpecial1stPost: false
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.svg"
    favicon32x32: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"
    safari_pinned_tab: "/favicon.svg"
  socialButtons:
    - name: "github"
      url: "https://github.com/jack-li-dev"
    - name: "email"
      url: "mailto:jack@jack-li.me"
  socialIcons:
    - name: "github"
      url: "https://github.com/jack-li-dev"
    - name: "email"
      url: "mailto:jack@jack-li.me"

outputs:
  home:
    - HTML
    - RSS
    - JSON
