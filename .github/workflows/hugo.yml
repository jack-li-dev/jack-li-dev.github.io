name: Deploy Hugo site to Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Inject rolling LTS date in CI sandbox
        run: |
          FUTURE_LTS="$(TZ="America/New_York" date -d "+365 days" "+%Y.%m.%d")"
          echo "FUTURE_LTS=${FUTURE_LTS}" >> "$GITHUB_ENV"
          echo "FUTURE_LTS=${FUTURE_LTS}"
          sed -i "s|\\[LTS: 2026\\.05\\.26\\]|[LTS: ${FUTURE_LTS}]|g" hugo.yaml
          grep -n "lts_string: \"\\[LTS: ${FUTURE_LTS}\\]\"" hugo.yaml

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify rendered LTS marker
        run: |
          grep -R "\\[LTS: ${FUTURE_LTS}\\]" public/index.html
          if grep -R "\\[LTS: 2026\\.05\\.26\\]" public; then
            echo "Static local LTS marker leaked into CI output."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
